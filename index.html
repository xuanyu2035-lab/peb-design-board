<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PEB 设计板</title>
<meta name="theme-color" content="#1F2A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PEB 设计板">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* 布局：上方工具条；竖屏时画板占上 2/3、文字区占下 1/3；横屏和电脑时文字区在右侧。画纸永远是白色。 */
:root{
  --ink:#1F2A2E; --ink2:#5B686C; --ink3:#8A9598; --line:#D3D9D8; --bg:#E7EBEA; --chrome:#F6F7F6; --paper:#FFFFFF;
  --accent:#0F6F7C; --accentSoft:#D7ECEE;
  --open:#2E7FD8; --rel:#3A4A50; --call:#C0267A; --claude:#7A4FD0; --guide:#E0389A;
  --f:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button,select,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}
/* ---------- 工具条 ---------- */
#bar{background:var(--chrome);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:6px 8px}
.brow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#pageRow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#pageRow::-webkit-scrollbar{display:none}
.grp{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--paper);flex:none}
.tb{border:0;background:transparent;border-radius:8px;min-height:38px;min-width:44px;padding:0 10px;font-size:14px;cursor:pointer;white-space:nowrap}
.tb:hover{background:var(--accentSoft)}
.tb.on{background:var(--accent);color:#fff}
.tb.k-open.on{background:var(--open)} .tb.k-rel.on{background:var(--rel)} .tb.k-call.on{background:var(--call)}
.tb:disabled{opacity:.35;cursor:default;background:transparent}
.tb:focus-visible,.pg:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lbl{font-size:12px;color:var(--ink2);padding:0 4px;flex:none}
.pg{border:1px solid var(--line);background:var(--paper);border-radius:8px;min-height:34px;padding:0 10px;font-size:13px;cursor:pointer;white-space:nowrap;flex:none}
.pg.on{border-color:var(--accent);background:var(--accentSoft);font-weight:600}
.pg.comp{border-style:dashed}
.pg.target{border-color:var(--open);border-style:dashed;color:var(--open)}
.sep{width:1px;align-self:stretch;background:var(--line);flex:none;margin:0 4px}
.spacer{flex:1 0 8px}
/* ---------- 主区 ---------- */
#main{min-height:0;display:grid;grid-template-rows:2fr 1fr}
@media (orientation:landscape) and (min-width:700px){#main{grid-template-rows:none;grid-template-columns:1fr minmax(300px,32%)}}
#stage{position:relative;min-height:0;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
#cv.panning{cursor:grabbing}
#ctx{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
#ctx>*{pointer-events:auto}
#ctx .msg{background:rgba(31,42,46,.9);color:#fff;font-size:13px;padding:6px 10px;border-radius:8px;pointer-events:none}
#ctx .msg.focus{background:var(--accent)}
#ctx .chips{display:flex;flex-wrap:wrap;gap:4px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:10px;padding:3px}
#ctx .cbtn{border:0;background:transparent;border-radius:7px;min-height:32px;padding:0 10px;font-size:13px;cursor:pointer}
#ctx .cbtn.on{background:var(--accent);color:#fff}
#ctx .cbtn.exit{background:var(--ink);color:#fff}
#selTools{position:absolute;z-index:5;display:flex;gap:2px;padding:2px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:9px;box-shadow:0 4px 12px rgba(20,30,34,.12)}
#selTools button{border:0;background:transparent;border-radius:7px;min-height:32px;padding:0 9px;font-size:12px;cursor:pointer;white-space:nowrap}
#selTools button:hover{background:var(--accentSoft)}
.pop .gapin{display:flex;gap:6px;padding:6px}
.pop .gapin input{width:90px;border:1px solid var(--line);border-radius:8px;min-height:38px;padding:0 8px;font-size:15px}
.pop .gapin button{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:0 14px;cursor:pointer}
#tryBar{position:absolute;right:10px;top:10px;display:flex;gap:6px;align-items:center}
#tryBar span{background:var(--accent);color:#fff;font-size:13px;padding:6px 10px;border-radius:8px}
#tryBar button{min-height:38px;border:0;border-radius:8px;background:var(--ink);color:#fff;padding:0 14px;cursor:pointer}
#zoomBox{position:absolute;right:10px;bottom:10px;display:flex;gap:4px;align-items:center}
#zoomBox button{min-width:40px;min-height:36px;border:1px solid var(--line);background:var(--paper);border-radius:8px;cursor:pointer}
#zoomBox span{font-family:var(--mono);font-size:12px;color:var(--ink2);background:rgba(255,255,255,.8);padding:2px 6px;border-radius:6px}
/* ---------- 文字区 ---------- */
#panel{min-height:0;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-rows:auto auto 1fr auto}
@media (orientation:landscape) and (min-width:700px){#panel{border-top:0;border-left:1px solid var(--line)}}
#phead{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
#title{flex:1;min-width:0;border:0;border-bottom:1px dashed transparent;font-weight:600;font-size:16px;background:transparent;padding:4px 0}
#title:focus{outline:none;border-bottom-color:var(--accent)}
#saved{font-size:12px;color:var(--ink3);white-space:nowrap}
#ptabs{display:flex;gap:4px;padding:6px 10px 0;border-bottom:1px solid var(--line)}
.ptab{border:1px solid var(--line);border-bottom:0;background:var(--chrome);border-radius:8px 8px 0 0;min-height:34px;padding:0 14px;font-size:14px;cursor:pointer}
.ptab.on{background:var(--paper);font-weight:600;position:relative;top:1px}
#logicBox{display:grid;gap:8px;padding:10px}
#logicBox h4{margin:0;font-size:14px;color:var(--ink2);font-weight:600}
#logicTa{width:100%;min-height:180px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;line-height:1.7;background:var(--paper)}
#logicTa:focus{outline:2px solid var(--accent);outline-offset:-1px}
.refs{display:flex;flex-wrap:wrap;gap:4px}
.refs button{border:1px solid var(--line);background:var(--paper);border-radius:12px;min-height:30px;padding:0 9px;font-size:12px;cursor:pointer}
.refs button.t-frame{color:#3F6E62}.refs button.t-button{color:#9A5B12}.refs button.t-point{color:#5B4FA0}.refs button.t-line{color:var(--rel)}
.refs .h{font-size:12px;color:var(--ink3);align-self:center;margin-right:4px}
#tree{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:4px 0 12px}
.fold{display:flex;align-items:center;gap:6px;padding-top:6px;padding-bottom:6px;padding-right:10px;cursor:pointer;font-size:13px;color:var(--ink2);user-select:none}
.fold b{color:var(--ink);font-weight:600}
.fold .c{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.fold .ar{display:inline-block;width:12px;transition:transform .15s}
.fold.shut .ar{transform:rotate(-90deg)}
.d1{padding-left:10px}.d2{padding-left:26px}.d3{padding-left:42px}.d4{padding-left:58px}.d5{padding-left:74px}.d6{padding-left:90px}.d7{padding-left:106px}
.row{display:flex;align-items:center;gap:8px;padding-top:3px;padding-bottom:3px;padding-right:6px;min-height:40px;cursor:pointer;border-left:3px solid transparent}
.row:hover{background:#F2F5F4}
.row.sel{background:var(--accentSoft);border-left-color:var(--accent)}
.row.cur{font-weight:600}
.row.locked .nm{color:var(--ink2)}
.num{font-family:var(--mono);font-size:12px;min-width:48px;color:var(--ink2);white-space:nowrap}
.num.t-frame{color:#3F6E62}.num.t-button{color:#9A5B12}.num.t-point{color:#5B4FA0}.num.t-open{color:var(--open)}.num.t-rel{color:var(--rel)}.num.t-call{color:var(--call)}.num.t-func{color:var(--call);font-weight:700}.num.t-comp{color:#7A5A12}
.nm{flex:1;min-width:0;border:0;background:transparent;padding:6px 0;font-size:15px}
.nm:focus{outline:none;border-bottom:1px solid var(--accent)}
.tag{font-size:11px;color:var(--ink3);white-space:nowrap;border:1px solid var(--line);border-radius:6px;padding:0 5px}
.tag.cl{color:var(--claude);border-color:var(--claude)}
.tag.op{color:var(--open);border-color:var(--open)}
.tag.ca{color:var(--call);border-color:var(--call)}
.prev{font-size:12px;color:var(--ink3);max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk{flex:none;border:1px solid transparent;background:transparent;border-radius:6px;min-width:40px;min-height:30px;font-size:12px;color:var(--ink3);cursor:pointer}
.lk:hover{border-color:var(--line)}
.lk.on{background:var(--ink);color:#fff}
.lk.inh{color:var(--ink2);border-color:var(--line);border-style:dashed}
.detail{margin:0 10px 8px 0;padding:8px 10px;background:#F7F9F8;border:1px solid var(--line);border-radius:8px;display:grid;gap:8px}
.detail textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--paper);font-size:14px;line-height:1.5}
.detail .r{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink2)}
.detail select{border:1px solid var(--line);border-radius:6px;min-height:32px;background:var(--paper);padding:0 6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:14px;min-height:30px;padding:0 10px;font-size:13px;cursor:pointer}
.chip.on{background:var(--call);border-color:var(--call);color:#fff}
.sbtn{border:1px solid var(--line);background:var(--paper);border-radius:6px;min-height:32px;padding:0 10px;font-size:13px;cursor:pointer}
.sbtn.del{color:#B3261E;border-color:#E3B6B2}
.sbtn.ok{color:var(--claude);border-color:var(--claude)}
.empty{font-size:12px;color:var(--ink3);padding-top:2px;padding-bottom:6px}
#addBar{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line);background:var(--chrome)}
#addIn{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:0 10px;min-height:40px;background:var(--paper);font-size:15px}
#addIn:focus{outline:2px solid var(--accent);outline-offset:-1px}
#addBar button{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:0 14px;min-height:40px;cursor:pointer}
/* ---------- 弹层 ---------- */
.pop{position:fixed;z-index:30;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,30,34,.18);padding:6px;max-height:70vh;overflow:auto;min-width:240px}
.pop button.mi{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;min-height:40px;padding:0 12px;cursor:pointer;font-size:14px}
.pop button.mi:hover{background:var(--accentSoft)}
.pop .mh{font-size:12px;color:var(--ink3);padding:8px 12px 4px}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.pop .lay{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px}
.pop .lay button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px;cursor:pointer;display:grid;gap:4px;justify-items:center;font-size:12px}
.pop .lay button:hover{border-color:var(--accent)}
.pop .lay svg{width:64px;height:48px}
#veil{position:fixed;inset:0;z-index:40;background:rgba(20,30,34,.35);display:grid;place-items:center;padding:16px}
#modal{background:var(--paper);border-radius:14px;max-width:460px;width:100%;padding:18px;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#modal h3{margin:0;font-size:17px}
#modal p{margin:0;color:var(--ink2);line-height:1.6;font-size:14px}
#modal .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
#modal .btns button{min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--paper);padding:0 14px;cursor:pointer}
#modal .btns button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:50;background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="brow">
      <div class="grp" role="group" aria-label="工具">
        <button class="tb" data-tool="select" title="选择和移动（V）">选择</button>
        <button class="tb" data-tool="frame" title="连点两下加一个框（F）">框</button>
        <button class="tb" data-tool="button" title="连点两下加一个按键（B）">按键</button>
        <button class="tb" data-tool="point" title="连点两下加一个点">点</button>
        <button class="tb" data-tool="pen" title="手画（P）">笔</button>
        <button class="tb" data-tool="eraser" title="擦掉手画的笔画">橡皮</button>
      </div>
      <div class="grp" role="group" aria-label="连线">
        <button class="tb k-open" data-line="open" title="开启线：点这个，打开那个">开启线</button>
        <button class="tb k-rel" data-line="rel" title="关系线：两个东西之间的关系">关系线</button>
        <button class="tb k-call" data-line="call" title="调用线：这个东西调用哪些功能">调用线</button>
      </div>
      <div class="grp" role="group" aria-label="图层">
        <button class="tb" data-layer="1">层1</button>
        <button class="tb" data-layer="2">层2</button>
        <button class="tb" data-layer="3">层3</button>
        <button class="tb" id="layHide" title="隐藏或显示当前层">隐藏</button>
        <button class="tb" id="layLock" title="锁住当前层">锁层</button>
      </div>
      <div class="grp" role="group" aria-label="辅助">
        <button class="tb" id="pageLock" title="固定页面：拖页面外面不会移动画面；页面里的东西照样能拖，照样能缩放">固定页面</button>
        <button class="tb" id="snapBtn" title="拖动时自动对齐别的东西的边和中线">吸附</button>
        <button class="tb" id="gridBtn" title="显示网格，并对齐网格">网格</button>
        <button class="tb" id="layoutBtn" title="一键铺好常用布局">布局</button>
        <button class="tb" id="partsBtn" title="现成零件和你做的组件">零件</button>
      </div>
      <div class="grp">
        <button class="tb" id="tryBtn" title="锁住全部，点按键试用">试用</button>
      </div>
      <div class="grp">
        <button class="tb" id="undoBtn" title="撤销（Ctrl+Z）">撤销</button>
        <button class="tb" id="redoBtn" title="重做（Ctrl+Y）">重做</button>
        <button class="tb" id="delBtn" title="删除选中的（Delete）">删除</button>
      </div>
      <div class="grp">
        <button class="tb" id="fileBtn">文件</button>
      </div>
    </div>
    <div class="brow" id="pageRow"></div>
  </header>
  <div id="main">
    <div id="stage">
      <svg id="cv" xmlns="http://www.w3.org/2000/svg" aria-label="画板">
        <defs id="defs"></defs>
        <g id="world"></g>
        <g id="live"></g>
      </svg>
      <div id="ctx"></div>
      <div id="selTools" hidden><button id="gapNow" title="预定间距">间距 16</button><button id="gapCustom" title="自定义间距">自定义</button><button id="dupBtn" title="复制一份放旁边（Ctrl+D）">复制一份</button></div>
      <div id="tryBar" hidden><span>试用中：点按键看效果</span><button id="tryBack" hidden>返回</button><button id="tryExit">退出试用</button></div>
      <div id="zoomBox"><span id="zPct">100%</span><button id="zOut" aria-label="缩小">−</button><button id="zFit">整页</button><button id="zIn" aria-label="放大">＋</button></div>
    </div>
    <aside id="panel">
      <div id="phead"><input id="title" aria-label="稿件名字"><span id="saved"></span></div><div id="ptabs"><button class="ptab on" data-ptab="items">栏</button><button class="ptab" data-ptab="logic">逻辑说明</button></div>
      <div id="tree"></div>
      <form id="addBar" autocomplete="off"><input id="addIn" enterkeyhint="done" placeholder="新加一栏：框 登录区 / 按键 搜索 / 点 / 线 / 页面 设置 / 组件 侧栏 / 功能 翻译" aria-label="新加一栏"><button type="submit">加入</button></form>
    </aside>
  </div>
</div>
<input type="file" id="fileIn" hidden>
<div id="toast" role="status"></div>

<script>
"use strict";
/* =====================================================================
   PEB 设计板 v2.1 —— 单文件程序。数据格式见导出包里的《给AI的格式说明》。
   ===================================================================== */
const APP_VER="2.2.0";
const FORMAT="peb-design-board";
const SCREENS=[
 {k:"ipadv",n:"iPad 竖 820×1180",w:820,h:1180},
 {k:"ipadh",n:"iPad 横 1180×820",w:1180,h:820},
 {k:"v1080",n:"竖屏副屏 1080×1920",w:1080,h:1920},
 {k:"v1080t",n:"竖屏 去任务栏 1080×1872",w:1080,h:1872},
 {k:"h1920",n:"横屏 1920×1080",w:1920,h:1080},
 {k:"h1920t",n:"横屏 去任务栏 1920×1032",w:1920,h:1032},
 {k:"peb",n:"PEB 现在窗口 1280×900",w:1280,h:900},
 {k:"phone",n:"手机 390×844",w:390,h:844},
 {k:"logic",n:"逻辑图大画布 3000×2000",w:3000,h:2000},
 {k:"c-side",n:"组件：侧栏 360×900",w:360,h:900},
 {k:"c-panel",n:"组件：面板 600×800",w:600,h:800},
 {k:"c-card",n:"组件：卡片 400×300",w:400,h:300},
 {k:"c-dialog",n:"组件：弹窗 640×420",w:640,h:420},
 {k:"c-bar",n:"组件：横条 1000×120",w:1000,h:120}
];
/* 默认大小：框按"所在的框或页面"的比例；按键按字号单位 */
const SPLITS=[1,2,3,4,5,6,7];const GAPS=[0,4,8,12,16,20,24,32,40,48];
const BTN_SIZES=[["小",5,2.2],["中",7,2.6],["大",10,3.2],["宽条",0,2.8],["方形",2.8,2.8]];
const LAYOUTS=[
 ["顶栏 + 内容",[["顶栏",0,0,1,.1],["内容",0,.1,1,1]]],
 ["侧边栏 + 内容",[["侧边栏",0,0,.26,1],["内容",.26,0,1,1]]],
 ["顶栏 + 侧边栏 + 内容",[["顶栏",0,0,1,.1],["侧边栏",0,.1,.26,1],["内容",.26,.1,1,1]]],
 ["上中下",[["顶栏",0,0,1,.1],["内容",0,.1,1,.9],["底栏",0,.9,1,1]]],
 ["上下两块",[["上",0,0,1,.5],["下",0,.5,1,1]]],
 ["左右两块",[["左",0,0,.5,1],["右",.5,0,1,1]]],
 ["三列",[["左",0,0,1/3,1],["中",1/3,0,2/3,1],["右",2/3,0,1,1]]],
 ["2×2 宫格",[["左上",0,0,.5,.5],["右上",.5,0,1,.5],["左下",0,.5,.5,1],["右下",.5,.5,1,1]]],
 ["列表 5 行",[0,1,2,3,4].map(i=>["第"+(i+1)+"行",0,i/5,1,(i+1)/5])]
];

function newPage(name,scrKey,kind){const s=SCREENS.find(x=>x.k===scrKey)||SCREENS[0];return{id:uid(),kind:kind||"page",name:name||"",note:"",scr:s.k,w:s.w,h:s.h,items:[],strokes:[],by:"",lk:false,logic:""}}

function normalize(d){
  if(!d||d.format!==FORMAT)throw new Error("这不是 PEB 设计板的稿件文件");
  d.id=d.id||uid();d.funcs=Array.isArray(d.funcs)?d.funcs:[];d.pages=Array.isArray(d.pages)&&d.pages.length?d.pages:[newPage("页面 1")];
  d.layers=Array.isArray(d.layers)&&d.layers.length===3?d.layers:newLayers();
  d.funcs.forEach(f=>{f.id=f.id||uid();f.name=f.name||"";f.note=f.note||"";f.by=f.by||"";f.comp=f.comp||""});
  if(!d.pages.some(p=>p.kind!=="comp"))d.pages.unshift(newPage("页面 1"));
  d.pages.forEach(p=>{p.id=p.id||uid();p.kind=p.kind==="comp"?"comp":"page";p.items=Array.isArray(p.items)?p.items:[];p.strokes=Array.isArray(p.strokes)?p.strokes:[];p.note=p.note||"";p.name=p.name||"";p.by=p.by||"";p.lk=!!p.lk;p.logic=p.logic||"";
    const s=SCREENS.find(x=>x.k===p.scr);p.w=+p.w||(s?s.w:820);p.h=+p.h||(s?s.h:1180);if(!s){const m=SCREENS.find(x=>x.w===p.w&&x.h===p.h);p.scr=m?m.k:"custom"}
    p.items.forEach(it=>{it.id=it.id||uid();it.L=clamp(+it.L||1,1,3);it.name=it.name||"";it.note=it.note||"";it.by=it.by||"";it.lk=!!it.lk;
      if(it.t==="line"){it.k=["open","rel","call"].includes(it.k)?it.k:"rel";it.calls=Array.isArray(it.calls)?it.calls:[];it.rk=it.rk||"";it.b=it.b||null;it.bp=it.bp||null}
      else{it.t=["frame","button","point"].includes(it.t)?it.t:"frame";it.x=+it.x||0;it.y=+it.y||0;if(it.t!=="point"){it.w=Math.max(16,+it.w||100);it.h=Math.max(12,+it.h||60)}it.st=it.st||"";it.ref=it.ref||""}});
    p.strokes.forEach(s=>{s.id=s.id||uid();s.L=clamp(+s.L||1,1,3);s.pts=Array.isArray(s.pts)?s.pts:[]});
  });
  const pids=new Set(d.pages.map(x=>x.id));
  d.pages.forEach(p=>{const ids=new Set(p.items.filter(i=>i.t!=="line").map(i=>i.id));
    p.items=p.items.filter(i=>i.t!=="line"||(ids.has(i.a)&&(i.k==="call"||ids.has(i.b)||pids.has(i.bp))));
    p.items.forEach(i=>{if(i.ref&&!d.pages.some(x=>x.id===i.ref&&x.kind==="comp"))i.ref=""})});
  d.gap=Number.isFinite(+d.gap)&&d.gap!==""?+d.gap:16;d.title=d.title||"设计稿";d.edits=+d.edits||0;return d}

/* ---------- 编号（每次按顺序算，删掉后自动重排） ---------- */
function numbering(p){
  p=p||page();const m={},frames=p.items.filter(i=>i.t==="frame");
  const kids=pid=>frames.filter(f=>f.p===pid);
  const walk=(pid,prefix)=>kids(pid).forEach((f,i)=>{const n=prefix+"."+(i+1);m[f.id]="框"+n;walk(f.id,n)});
  frames.filter(f=>!f.p||!frames.some(g=>g.id===f.p)).forEach((f,i)=>{m[f.id]="框"+(i+1);walk(f.id,String(i+1))});
  let b=0,pt=0,c={open:0,rel:0,call:0};
  p.items.forEach(i=>{if(i.t==="button")m[i.id]="键"+(++b);else if(i.t==="point")m[i.id]="点"+(++pt);else if(i.t==="line")m[i.id]=KP[i.k]+(++c[i.k])});
  return m}

/* ---------- 几何 ---------- */
function bbox(i,p){if(i.t==="point"){const r=lsOf(p||page())*.6;return{x:i.x-r,y:i.y-r,w:2*r,h:2*r}}return{x:i.x,y:i.y,w:i.w,h:i.h}}
function center(i,p){const b=bbox(i,p);return{x:b.x+b.w/2,y:b.y+b.h/2}}
function clipTo(i,from,p){const c=center(i,p);if(i.t==="point"){const r=lsOf(p||page())*.6,dx=from.x-c.x,dy=from.y-c.y,d=Math.hypot(dx,dy)||1;return{x:c.x+dx/d*r,y:c.y+dy/d*r}}
  const b=bbox(i,p),dx=from.x-c.x,dy=from.y-c.y;if(!dx&&!dy)return c;const s=Math.min(b.w/2/Math.abs(dx||1e-9),b.h/2/Math.abs(dy||1e-9),1);return{x:c.x+dx*s,y:c.y+dy*s}}
const contains=(f,pt)=>pt.x>=f.x&&pt.x<=f.x+f.w&&pt.y>=f.y&&pt.y<=f.y+f.h;
function ancestors(it,p){p=p||page();const out=[];let c=it,g=0;while(c&&c.p&&g++<99){c=p.items.find(x=>x.id===c.p);if(c)out.push(c)}return out}
function isAncestor(aId,id,p){const it=byId(id,p);return!!it&&ancestors(it,p).some(a=>a.id===aId)}
/* 谁在谁里面：按位置自动算，取最小的那个框。上层的东西不会被算进看不见的下层框里。 */
function recomputeParents(p){
  p=p||page();const frames=p.items.filter(i=>i.t==="frame");
  const anc=(aId,id)=>{let c=frames.find(x=>x.id===id),g=0;while(c&&c._p&&g++<99){if(c._p===aId)return true;c=frames.find(x=>x.id===c._p)}return false};
  const find=(pt,L,selfId,selfArea)=>{let best=null,ba=Infinity;frames.forEach(f=>{if(f.id===selfId||f.L>L)return;if(selfArea&&f.w*f.h<=selfArea)return;if(selfId&&anc(selfId,f.id))return;if(contains(f,pt)){const a=f.w*f.h;if(a<ba){ba=a;best=f}}});return best?best.id:null};
  frames.forEach(f=>f._p=null);
  [...frames].sort((a,b)=>b.w*b.h-a.w*a.h).forEach(f=>{f._p=find(center(f,p),f.L,f.id,f.w*f.h)});
  frames.forEach(f=>{f.p=f._p;delete f._p});
  p.items.forEach(i=>{if(i.t==="button"||i.t==="point")i.p=find(center(i,p),i.L,null)});
  p.strokes.forEach(s=>{const b=strokeBox(s);s.p=find({x:b.x+b.w/2,y:b.y+b.h/2},s.L,null)});
}
function strokeBox(s){let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;for(let k=0;k<s.pts.length;k+=2){x1=Math.min(x1,s.pts[k]);x2=Math.max(x2,s.pts[k]);y1=Math.min(y1,s.pts[k+1]);y2=Math.max(y2,s.pts[k+1])}return{x:x1,y:y1,w:x2-x1,h:y2-y1}}
function descendants(id,p){p=p||page();const out=[];const walk=pid=>p.items.forEach(i=>{if(i.t!=="line"&&i.p===pid){out.push(i);if(i.t==="frame")walk(i.id)}});walk(id);return out}
/* 锁：自己锁了、所在的框锁了、页面锁了、图层锁了，都算锁住 */
function lockReason(it,p){p=p||page();if(p.lk)return"页面已锁";if(it.lk)return"已锁";if(isNode(it)){if(doc.layers[it.L-1].lock)return"层"+it.L+"已锁";const a=ancestors(it,p).find(x=>x.lk);if(a)return"所在的框已锁"}else{const a=byId(it.a,p);if(a&&a.lk)return"起点已锁"}return""}
const isLocked=(it,p)=>!!lockReason(it,p);
const inFocus=it=>!focusId||it.id===focusId||isAncestor(focusId,it.id);
const pageRect=p=>({x:0,y:0,w:(p||page()).w,h:(p||page()).h});
/* 双击位置所在的容器：最小的、包含这个点的框（框内编辑时只在那个框里找） */
function containerAt(pt){const p=page();let best=null,ba=Infinity;p.items.forEach(f=>{if(f.t!=="frame"||f.ref||f.L>curLayer||!layerShown(f.L))return;if(focusId&&!inFocus(f))return;if(contains(f,pt)){const a=f.w*f.h;if(a<ba){ba=a;best=f}}});return best}

const snap=()=>JSON.stringify([doc.title,doc.funcs,doc.pages,doc.layers]);
function commit(){const s=snap();if(s===lastSnap)return;undoStack.push(lastSnap);if(undoStack.length>120)undoStack.shift();redoStack=[];lastSnap=s;doc.edits++;doc.savedAt=nowISO();doc.savedOn=DEVICE;scheduleSave();updateUndo()}
function restore(s){const a=JSON.parse(s);doc.title=a[0];doc.funcs=a[1];doc.pages=a[2];doc.layers=a[3];lastSnap=s;if(!doc.pages.some(p=>p.id===pageId))pageId=doc.pages[0].id;if(sel&&sel.k==="item"&&!byId(sel.id))sel=null;if(focusId&&!byId(focusId))focusId=null;doc.savedAt=nowISO();scheduleSave();render()}
function doUndo(){if(!undoStack.length)return;redoStack.push(lastSnap);restore(undoStack.pop());updateUndo()}
function doRedo(){if(!redoStack.length)return;undoStack.push(lastSnap);restore(redoStack.pop());updateUndo()}

  if(sx>=0&&sy>=0&&sx+sw<=r.width&&sy+sh<=r.height)return;v.x=r.width/2-(b.x+b.w/2)*v.z;v.y=r.height/2-(b.y+b.h/2)*v.z;applyView()}

function openTargets(p){p=p||page();const s=new Set();p.items.forEach(l=>{if(l.t==="line"&&l.k==="open"&&l.b)s.add(l.b)});return s}
function needsOpen(c,p,tg){if(tg.has(c.id))return true;if(c.L>1){const par=c.p&&p.items.find(x=>x.id===c.p);return!(par&&par.L>1)}return false}
function visibleInTry(i,p,opened){p=p||page();const tg=openTargets(p);const chain=isNode(i)?[i,...ancestors(i,p)]:[];for(const c of chain){if(needsOpen(c,p,tg)&&!opened.has(c.id))return false}return true}
function strokeVisibleInTry(s,p,opened){if(!s.p)return s.L===1;const f=p.items.find(x=>x.id===s.p);return f?visibleInTry(f,p,opened):s.L===1}

/* opt.exp=导出图片；opt.inst=画组件实例（不能点、不画线） */
function drawPage(p,opt){

  const N=numbering(p),ls=lsOf(p),out=[];

  const empty=new Set();
  const vis=i=>inst?visibleInTry(i,p,empty):exp?true:(tm?visibleInTry(i,p,tryOpen):layerShown(i.L));
  const svis=s=>inst?strokeVisibleInTry(s,p,empty):exp?true:(tm?strokeVisibleInTry(s,p,tryOpen):layerShown(s.L));
  const did=i=>liveMode?` data-id="${i.id}"`:"";
  const dim=i=>{if(!liveMode||tm)return"";if(focusId&&isNode(i)&&!inFocus(i))return' opacity=".18" pointer-events="none"';return i.L!==curLayer?' opacity=".45"':""};
  const focusDimStroke=s=>liveMode&&!tm&&focusId&&!(s.p&&(s.p===focusId||isAncestor(focusId,s.p)))?' opacity=".18"':"";

const AI_README=`给 AI 的格式说明（PEB 设计板 ${APP_VER}）
=====================================
这个包里有：
- 稿件.pebboard.json：完整数据，可以原样还原。
- 文字清单.md：同样的内容，写成人能读的样子。
- 页N_名字.png / 组件N_名字.png：每个页面和组件的图片。

稿件 JSON（format="${FORMAT}", ver=2）
- funcs[]：功能库 {id,name,note,by,comp}。字母 A、B、C 按数组顺序算，不存。comp=这个功能的界面组件（pages 里 kind="comp" 的 id）。
- pages[]：{id,kind("page"|"comp"),name,note,scr,w,h,items[],strokes[],by,lk}。坐标原点 = 页面左上角，单位 = 屏幕像素。
- items[]，t 表示种类：
  - "frame" 框：{id,t,L(层1-3),x,y,w,h,p,name,note,st,by,lk,ref}。ref=放进来的组件 id（有 ref 的框显示那个组件的内容）。
  - "button" 按键：{id,t,L,x,y,w,h,p,name,note,st,by,lk}
  - "point" 点：{id,t,L,x,y,p,name,note,by,lk}
  - "line" 线：{id,t,k,a,b,bp,calls[],rk,name,note,by,lk}
    k="open" 开启线：点 a，打开或关上框 b；或跳到页面 bp。被开启线指着的框，试用时一开始是关着的。
    k="rel"  关系线：a 和 b 的关系，rk = contain(包含)/affect(影响)/cross(跨大区调用)/share(共享知识库)/空。
    k="call" 调用线：a 调用 calls[] 里的功能 id。
- p（所在框）由位置自动算，可以不填。编号（框1.2、键3、开1）也自动算，不存。
- 层2、层3 的最外层框 = 弹出层，试用时一开始关着。
- gap：整份稿件的标准间距（像素），框之间、框和边之间按这个对齐。
- st 状态：have 现有 / change 要改 / new 新建 / later 以后 / tbd 未定。
- strokes[]：手画 {id,L,c,w,pts[x,y,x,y...]}。

Claude 参与设计的规则（用户选“文件 → 加入 Claude 的设计”）
1. 做法：拿到用户最新导出的稿件，在上面加东西或改东西，导出一份同格式的 JSON。
2. 加东西：新的东西用新的 id，by 写 "claude"。可以加进已有页面（用已有页面的 id），也可以加新页面、新组件、新功能。
3. 改东西：保留原来的 id，把 by 写成 "claude"，程序就会用新内容替换。by 不是 "claude" 的已有东西不会被改动。
4. 不能删用户的东西。想建议删除，就在 note 里写明。
5. 功能：id 相同时按 3 处理；id 不同但名字相同，算同一个功能。
6. 加进来的东西显示为紫色虚线。用户可以一个一个“采纳”，也可以全部采纳或全部拒绝。

只设计某一页（最常用）
- 用户在程序里选“文件 → 导出这一页给 Claude”，得到“这一页.pebboard.json”（onePage=那一页的 id）。空白页就是模板。
- Claude 在这一页上画：保持 format、ver、这一页的 id、w、h 不变，往 items 里加框、按键、点、线，by 都写 "claude"。
- 把这份 JSON 交回给用户。用户加入时，可以选：作为新的一页（默认）、替换原来那一页、加到原来那一页。
- 页面的 logic 是逻辑说明文字。里面的 ⟦id⟧ 表示引用某个东西，程序会显示成【键3 搜索】。

    if(ex){if(p.logic&&mode==="into"&&p.logic!==ex.logic)ex.logic=ex.logic?ex.logic+"\n\n—— Claude 的解读 ——\n"+p.logic:p.logic; // 已有页面：加新东西，改 by=claude 的东西
      if(p.by==="claude"){ex.name=p.name;ex.note=p.note;ex.by="claude";changed++}
      const imap={};p.items.forEach(i=>{imap[i.id]=ex.items.some(x=>x.id===i.id)?i.id:(allIds.has(i.id)?uid():i.id)});
      p.items.forEach(i=>{const c=fixRefs({...i,id:imap[i.id]});if(c.t==="line"){c.a=imap[c.a]||c.a;if(c.b)c.b=imap[c.b]||c.b}
        const old=ex.items.find(x=>x.id===c.id);if(old){if(i.by==="claude"){Object.assign(old,c,{by:"claude"});changed++}}else{c.by=c.by||"claude";ex.items.push(c);addItems++}});
      p.strokes.forEach(s=>{if(!ex.strokes.some(x=>x.id===s.id)){ex.strokes.push({...s,id:allIds.has(s.id)?uid():s.id});addItems++}});
      const ids=new Set(ex.items.filter(i=>i.t!=="line").map(i=>i.id));ex.items=ex.items.filter(i=>i.t!=="line"||(ids.has(i.a)&&(i.k==="call"||ids.has(i.b)||i.bp)));recomputeParents(ex)}
    else{const imap={};p.items.forEach(i=>imap[i.id]=allIds.has(i.id)?uid():i.id);
      const np={...p,id:pmap[p.id],by:p.by||"claude",logic:(p.logic||"").replace(/⟦([^⟧]+)⟧/g,(m,id)=>"⟦"+(imap[id]||id)+"⟧"),items:p.items.map(i=>{const c=fixRefs({...i,id:imap[i.id]});if(c.p)c.p=imap[c.p]||null;if(c.t==="line"){c.a=imap[c.a];c.b=c.b?imap[c.b]:null}return c}),strokes:p.strokes.map(s=>({...s,id:uid(),p:null}))};
      doc.pages.push(np);recomputeParents(np);addPages++}});
  const firstNew=d.pages.map(p=>pmap[p.id]).find(id=>doc.pages.some(x=>x.id===id&&!isComp(x)));if(firstNew)pageId=firstNew;
  sel=null;focusId=null;commit();render();toast("已加入："+(addPages?"新页面/组件 "+addPages+" 个，":"")+"新东西 "+addItems+" 样，修改 "+changed+" 处。紫色虚线的就是",3500)}
function recomputeAll(){doc.pages.forEach(p=>recomputeParents(p))}
function newBlank(){modal("新建空白稿","现在这份稿件会被替换。还没导出的话，建议先导出。",[{t:"取消"},{t:"先导出",fn:async()=>{await exportDoc();openDoc(newDoc())}},{t:"新建",pri:1,fn:()=>{doc=newDoc();pageId=doc.pages[0].id;resetUI();lastSnap=snap();store.set("doc",doc);render()}}])}

/* ---------- 启动 ---------- */
(async function boot(){
  await store.open();
  const saved=await store.get("doc");if(saved){try{doc=normalize(saved)}catch(e){}}
  const ui=await store.get("ui");pageId=pagesOfKind("page")[0].id;if(ui){if(doc.pages.some(p=>p.id===ui.pageId))pageId=ui.pageId;curLayer=ui.curLayer||1;if(ui.snapOn!=null)snapOn=ui.snapOn;if(ui.gridOn!=null)gridOn=ui.gridOn}
  recomputeAll();lastSnap=snap();render();$("#saved").textContent=saved?"已读取上次的稿件":"新稿件";
  new ResizeObserver(()=>applyView()).observe(cv);
  window.addEventListener("orientationchange",()=>setTimeout(()=>{fitView();applyView()},300));
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
window.__peb={get doc(){return doc},get pageId(){return pageId},get focusId(){return focusId},get tryOpen(){return tryOpen},numbering,buildMD,openDoc,mergeDoc,makeZip,readZipJSON,normalize,render,enterFocus,exitFocus};
</script>
